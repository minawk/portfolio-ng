<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <script>
      document.documentElement.classList.add('js');

      try {
        const storedTheme = localStorage.getItem('theme');
        const systemTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        const theme = storedTheme === 'light' || storedTheme === 'dark' ? storedTheme : systemTheme;

        document.documentElement.dataset.theme = theme;
      } catch {}

      // Mark the first visit as done: Netlify's language redirect (netlify.toml)
      // reads this cookie instead of the browser language on later visits.
      if (!/(?:^|;\s*)nf_lang=/.test(document.cookie)) {
        const pageLanguage = document.documentElement.lang.split('-')[0] || 'fr';
        document.cookie = `nf_lang=${pageLanguage}; path=/; max-age=31536000; SameSite=Lax`;
      }
    </script>
    <title>Benjamina Randrianasolo (minawk) - Développeur Angular / Fullstack</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Poppins:wght@500..700&display=swap"
      rel="stylesheet"
    />
    <link rel="alternate" hreflang="fr" href="/" />
    <link rel="alternate" hreflang="en" href="/en/" />
    <link rel="alternate" hreflang="x-default" href="/" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-96x96.png" type="image/png" sizes="96x96" />
    <link rel="icon" href="/favicon-192x192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
