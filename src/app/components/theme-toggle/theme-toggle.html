<button
  type="button"
  class="theme-toggle"
  (click)="toggleTheme()"
  [attr.aria-pressed]="isDark()"
  [attr.aria-label]="isDark() ? lightLabel : darkLabel"
>
  @if (isDark()) {
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="4" />
      <path
        d="M12 2.5v2.2M12 19.3v2.2M4.8 4.8l1.6 1.6M17.6 17.6l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.8 19.2l1.6-1.6M17.6 6.4l1.6-1.6"
      />
    </svg>
  } @else {
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20.5 14.8A8.2 8.2 0 1 1 9.2 3.5a6.6 6.6 0 0 0 11.3 11.3z" />
    </svg>
  }
</button>
