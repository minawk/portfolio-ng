<section class="skills reveal" id="skills">
  <h2>
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <rect
        x="3.5"
        y="3.5"
        width="7"
        height="7"
        rx="1.4"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
      />
      <rect
        x="13.5"
        y="3.5"
        width="7"
        height="7"
        rx="1.4"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
      />
      <rect
        x="3.5"
        y="13.5"
        width="7"
        height="7"
        rx="1.4"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
      />
      <rect
        x="13.5"
        y="13.5"
        width="7"
        height="7"
        rx="1.4"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
      />
    </svg>
    <span i18n="@@skillsTitle">Compétences</span>
  </h2>
  <p i18n="@@skillsIntro">Regroupées selon le niveau d'usage.</p>
  @for (group of groups; track group.title) {
    <section class="group">
      <h3>{{ group.title }}</h3>
      <ul>
        @for (skill of group.skills; track skill.name) {
          <li>
            <app-skill-icon [name]="skill.icon" />
            <span>{{ skill.name }}</span>
          </li>
        }
      </ul>
    </section>
  }
</section>
