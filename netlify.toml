[build]
  command = "npm run build"
  publish = "dist/portfolio-ng/browser"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The language switch links to `/?lang=fr`: always serve the French page for it,
# even if the browser language or an old `nf_lang=en` cookie says English.
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
  force = true
  query = { lang = "fr" }

# First visit with an English browser/OS: send to the English version.
# Once the `nf_lang` cookie is set (see src/index.html), Netlify uses it
# instead of Accept-Language, so the visitor's choice is kept.
[[redirects]]
  from = "/"
  to = "/en/"
  status = 302
  force = true
  conditions = { Language = ["en"] }

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
  force = true
